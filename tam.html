<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu - Cà Phê Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/menu-board.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/footer.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main>
  <h1 class="sr-only">Menu</h1>

  <!-- Khuyến mãi: lướt ngang được -->
  <section class="promo" aria-roledescription="carousel" aria-label="Món khuyến mãi">
    <div class="promo-track" id="promo-track" tabindex="0"></div>
    <button type="button" class="promo-nav prev" id="promo-prev" aria-label="Khuyến mãi trước">&#8249;</button>
    <button type="button" class="promo-nav next" id="promo-next" aria-label="Khuyến mãi sau">&#8250;</button>
    <div class="promo-dots" id="promo-dots"></div>
  </section>


</main>
<script src="js/common.js"></script>
<script src="js/menu-board.js"></script>
<script src="js/contact.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
