<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <title>Đăng nhập - Cà phê web</title>
</head>
<body>
    <div id="wrapper">
        <form action="" id="form-login" autocomplete="off">
            <h1 class="form-heading">ĐĂNG NHẬP</h1>
            <div class="form-group">
                <i class="fas fa-user" aria-hidden="true"></i>
                <input type="text" class="form-input" id="username" placeholder="Tên đăng nhập" autocomplete="new-password">
            </div>
            <div class="form-group">
                <i class="fas fa-lock" aria-hidden="true"></i>
                <input type="password" class="form-input" id="password" placeholder="Mật khẩu" autocomplete="new-password">
                <div id="eye">
                    <i class="fas fa-eye" aria-hidden="true"></i>
                </div>
            </div>
            <input type="submit" value="Đăng nhập" class="form-submit">
            <div class="form-redirect">
                Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            </div>
        </form>
    </div>
</body>
<script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<script src="js/login.js"></script>
</html>
